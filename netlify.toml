# Routes below are served by the Astro build on its own Netlify site and
# proxied in under rathes.me. Netlify matches top-to-bottom, so keep the
# blocks most-specific-first.

[[redirects]]
  # Astro's hashed build assets. Kept above the per-route rules, since this
  # is a broader prefix match.
  from = "/_astro/*"
  to = "https://astro-rathes.netlify.app/_astro/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/work"
  to = "https://astro-rathes.netlify.app/work"
  status = 200
  force = true

